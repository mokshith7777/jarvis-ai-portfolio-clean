[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-agent-runtime"
version = "0.2.0"
description = "JARVIS Agent — a Hermes-compatible, fully rebranded autonomous agent runtime."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
]
[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]
[project.scripts]
jarvis = "jarvis_cli.commands:main"
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
