name: Sync JARVIS with upstream agent

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate JARVIS parity tree
        run: python scripts/rebrand_upstream.py
      - name: Restore JARVIS-owned metadata
        run: |
          test -f UPSTREAM_NOTICE.md
          test -f LICENSE
      - name: Commit parity update
        run: |
          git config user.name "JARVIS Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No upstream changes."
          else
            git commit -m "sync: update JARVIS from upstream"
            git push
          fi
